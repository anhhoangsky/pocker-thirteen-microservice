name: poker_thirteen
description: A Flutter mobile application for Poker Thirteen game management.
version: 1.0.0+1

environment:
  sdk: ">=2.19.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dio: ^5.3.2
  shared_preferences: ^2.2.1
  json_annotation: ^4.8.1
  flutter_secure_storage: ^9.0.0
  intl: ^0.18.1
  get_it: ^7.6.4
  injectable: ^2.3.0
  auto_route: ^7.8.3
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.7
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.0
  auto_route_generator: ^7.3.1
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/