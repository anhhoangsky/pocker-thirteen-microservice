version: "3.8"

services:
  telegram-bot:
    build:
      context: .
      dockerfile: ./apps/telegram-bot/Dockerfile
    ports:
      - "${TELEGRAM_BOT_PORT}:${TELEGRAM_BOT_PORT}"
    env_file:
      - .env
    depends_on:
      - postgres
      - game-management
      - financial-management
      - redis
    labels:
      - "dapr.io/enabled=true"
      - "dapr.io/app-id=telegram-bot"
      - "dapr.io/app-port=${TELEGRAM_BOT_PORT}"
      - "dapr.io/enable-api-logging=true"

  game-management:
    build:
      context: .
      dockerfile: ./apps/game-management/Dockerfile
    ports:
      - "${GAME_SERVICE_PORT}:${GAME_SERVICE_PORT}"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    labels:
      - "dapr.io/enabled=true"
      - "dapr.io/app-id=game-management"
      - "dapr.io/app-port=${GAME_SERVICE_PORT}"
      - "dapr.io/enable-api-logging=true"

  financial-management:
    build:
      context: .
      dockerfile: ./apps/financial-management/Dockerfile
    ports:
      - "${FINANCIAL_SERVICE_PORT}:${FINANCIAL_SERVICE_PORT}"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    labels:
      - "dapr.io/enabled=true"
      - "dapr.io/app-id=financial-management"
      - "dapr.io/app-port=${FINANCIAL_SERVICE_PORT}"
      - "dapr.io/enable-api-logging=true"

  postgres:
    build:
      context: ./apps/database
      dockerfile: Dockerfile
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${DB_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  dapr-placement:
    image: daprio/dapr:latest
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006:50006"

volumes:
  postgres_data:
  redis_data: